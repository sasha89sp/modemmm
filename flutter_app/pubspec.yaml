name: huawei_e173_manager
description: "Huawei E173 Portable Manager — портативная Windows-программа на Flutter для модема Huawei E173 (сценарии, Excel, PDU SMS, голос winmm, USSD, контакты, трей)."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  path: ^1.9.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  excel: ^4.0.6
  window_manager: ^0.4.3
  tray_manager: ^0.2.3
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
